name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release

  publish:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet pack src/FpsSoftware.Chassis/FpsSoftware.Chassis.csproj --configuration Release --output ./artifacts
      - run: dotnet nuget push ./artifacts/*.nupkg --source https://gitea.fpssoftware.uk/api/packages/fps-software/nuget/index.json --api-key ${{ secrets.GITEA_NUGET_TOKEN }} --skip-duplicate
